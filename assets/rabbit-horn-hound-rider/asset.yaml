id: rabbit-horn-hound-rider
title: Rabbit blowing a horn, riding a hound
description: A russet rabbit in a short red belted tunic sits astride a trotting gray-and-white hound facing right, holding the reins in one paw and blowing a curved gold hunting horn with the other; the hound wears a gold collar and its long tail curls up behind. Painted in a stippled manuscript manner with thin brown contours; the background is transparent.
